name: Bug report
description: Report a reproducible problem in Qentrah.
title: "[bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or version
      description: Commit SHA, branch, release, or deployment version.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, app surface, and relevant service versions.
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs or screenshots. Never include secrets or customer data.
