name: Feature request
description: Propose a product or developer-experience improvement.
title: "[feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should Qentrah solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing architecture.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and alternatives
      description: Add workflows, constraints, or alternatives already considered.
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Workspace web or desktop
        - Mobile
        - Marketing
        - Zapier or integrations
        - MCP or Eve agents
        - Shared packages or developer tooling
        - Documentation
    validations:
      required: true
