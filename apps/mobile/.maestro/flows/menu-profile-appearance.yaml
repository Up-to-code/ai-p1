appId: com.qentrah.mobile
name: Menu profile appearance
tags:
  - smoke
  - navigation
  - preferences
---
- runFlow: "shared/bootstrap-signed-in.yaml"
- tapOn:
    id: app.open_menu
- tapOn:
    id: menu.profile
- extendedWaitUntil:
    visible:
      id: profile.appearance
    timeout: 20000
- assertVisible:
    id: profile.active_workspace
- assertVisible:
    id: profile.switch_workspace
- assertVisible:
    id: profile.create_invite_link
- tapOn:
    id: profile.appearance
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 20000
- tapOn:
    id: appearance.option.light
- assertVisible:
    id: appearance.selected.light
- assertVisible: "Light"
- tapOn:
    id: appearance.option.dark
- assertVisible:
    id: appearance.selected.dark
- assertVisible: "Dark"
- tapOn:
    id: appearance.option.system
- assertVisible:
    id: appearance.selected.system
- assertVisible: "System"
- tapOn: "Go back"
- assertVisible:
    id: profile.appearance
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: menu.close
    timeout: 20000
- tapOn:
    id: menu.close
- extendedWaitUntil:
    visible:
      id: app.open_menu
    timeout: 20000
