appId: com.qentrah.mobile
name: Menu collections empty states
tags:
  - smoke
  - navigation
  - collections
---
- runFlow: "shared/bootstrap-signed-in.yaml"
- tapOn:
    id: app.open_menu
- tapOn:
    id: menu.saved
- extendedWaitUntil:
    visible: "No favorites yet"
    timeout: 20000
- tapOn: "Go back"
- extendedWaitUntil:
    visible:
      id: app.open_menu
    timeout: 20000
- tapOn:
    id: app.open_menu
- extendedWaitUntil:
    visible:
      id: menu.profile
    timeout: 20000
