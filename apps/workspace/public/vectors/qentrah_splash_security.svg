    <rect width="400" height="400" stroke="#0F172A" stroke-width="4" id="outer_gate"/>
    <rect x="40" y="40" width="320" height="320" stroke="#64748B" stroke-width="2" fill="#F1F5F9" opacity="0.1"/>
    
