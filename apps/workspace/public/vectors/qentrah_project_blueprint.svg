<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" id="qentrah_project_blueprint">
  <!-- Isometric Frame Concept -->
  <g id="isometric_grid" opacity="0.1">
    <path d="M200 0V400M0 200H400" stroke="#64748B" stroke-width="1"/>
  </g>
  <g id="blueprint_structure" transform="translate(100, 100)">
    <!-- Base -->
    <rect x="20" y="140" width="160" height="20" fill="#64748B" id="foundation"/>
    <!-- Wireframe Walls -->
    <path d="M40 140V40H160V140" stroke="#0F172A" stroke-width="2" fill="none"/>
    <!-- Constructor Line -->
    <rect x="30" y="60" width="100" height="4" fill="#2563EB" id="constructor_level"/>
    <!-- Internal Grid -->
    <path d="M40 80H160M100 40V140" stroke="#F1F5F9" stroke-width="1"/>
  </g>
</svg>
