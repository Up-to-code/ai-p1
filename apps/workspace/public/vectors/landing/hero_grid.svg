    <path d="M0 400 L400 0 L800 400" stroke="#64748B" stroke-width="1"/>
    <path d="M100 400 L400 0 L700 400" stroke="#64748B" stroke-width="1"/>
    <path d="M200 400 L400 0 L600 400" stroke="#64748B" stroke-width="1"/>
    <path d="M0 350 H800 M0 300 H800 M0 250 H800" stroke="#64748B" stroke-width="1"/>
