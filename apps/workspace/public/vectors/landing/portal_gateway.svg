<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" id="landing_portal_gateway">
  <!-- Monolithic Entrance Icons -->
  <g id="gateway" transform="translate(40, 40)">
    <rect width="20" height="120" fill="#0F172A" id="pillar_left"/>
    <rect x="100" width="20" height="120" fill="#0F172A" id="pillar_right"/>
    <rect x="20" y="20" width="80" height="10" fill="#2563EB" id="beam"/>
    
    <!-- Access Detail -->
