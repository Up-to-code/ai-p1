<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" id="landing_ecosystem_workspace">
  <!-- Central Workspace Cluster -->
  <g id="ecosystem" transform="translate(200, 200)">
    <!-- Hexagonal Core Logic -->
    <g id="triangles">
      <path d="M0 0 L-60 -100 L60 -100 Z" fill="#0F172A"/> 
      <path d="M0 0 L120 0 L60 -100 Z" fill="#64748B"/>
      <path d="M0 0 L60 100 L120 0 Z" fill="#0F172A"/>
      <path d="M0 0 L-60 100 L60 100 Z" fill="#64748B"/>
      <path d="M0 0 L-120 0 L-60 100 Z" fill="#0F172A"/>
      <path d="M0 0 L-60 -100 L-120 0 Z" fill="#64748B"/>
    </g>
    
    <!-- Institutional Orbital -->
    <circle cx="0" cy="0" r="140" stroke="#2563EB" stroke-width="2" stroke-dasharray="20 10" fill="none" opacity="0.3"/>
    <rect x="-5" y="-145" width="10" height="10" fill="#2563EB"/>
  </g>
</svg>
