<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" id="landing_ai_connection">
  <!-- The Neural Bridge -->
  <g id="ai_bridge" transform="translate(200, 200)">
    <!-- Central Workspace -->
    <rect x="-15" y="-15" width="30" height="30" fill="#2563EB" id="ai_core"/>
    
    <!-- Radiating Connectors -->
    <g stroke="#F1F5F9" stroke-width="2">
      <path d="M0 -15 V -150"/>
      <path d="M0 15 V 150"/>
      <path d="M-15 0 H -150"/>
      <path d="M15 0 H 150"/>
      <path d="M10.6 -10.6 L 100 -100"/>
      <path d="M-10.6 -10.6 L -100 -100"/>
      <path d="M10.6 10.6 L 100 100"/>
      <path d="M-10.6 10.6 L -100 100"/>
    </g>
    
    <!-- Peripheral Nodes -->
    <rect x="-5" y="-155" width="10" height="10" fill="#0F172A"/>
    <rect x="-5" y="145" width="10" height="10" fill="#0F172A"/>
    <rect x="-155" y="-5" width="10" height="10" fill="#0F172A"/>
    <rect x="145" y="-5" width="10" height="10" fill="#2563EB" id="active_node"/>
    
    <rect x="95" y="-105" width="10" height="10" stroke="#64748B" stroke-width="2" fill="none"/>
    <rect x="-105" y="-105" width="10" height="10" stroke="#64748B" stroke-width="2" fill="none"/>
    <rect x="95" y="95" width="10" height="10" stroke="#64748B" stroke-width="2" fill="none"/>
    <rect x="-105" y="95" width="10" height="10" stroke="#64748B" stroke-width="2" fill="none"/>
  </g>
</svg>
