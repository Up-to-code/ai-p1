    <!-- Events -->
    <rect x="16" y="40" width="8" height="8" fill="#2563EB" id="event_1"/>
    <rect x="16" y="120" width="8" height="8" fill="#0F172A" id="event_2"/>
    <rect x="16" y="160" width="8" height="8" fill="#2563EB" id="event_3"/>
    <rect x="16" y="240" width="8" height="8" fill="#64748B" id="event_4"/>
