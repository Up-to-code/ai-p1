<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" id="qentrah_security_gate">
  <!-- Monolithic Entrance / Lock -->
  <g id="gate" transform="translate(100, 80)">
    <rect x="0" y="0" width="200" height="240" stroke="#0F172A" stroke-width="4" id="outer_frame"/>
    <rect x="40" y="40" width="120" height="160" fill="#F1F5F9" opacity="0.2" id="inner_fill"/>
    <!-- Solid Security Workspace -->
    <rect x="80" y="100" width="40" height="40" fill="#2563EB" id="lock_workspace"/>
    <!-- Guard Lines -->
    <path d="M20 120H80M120 120H180" stroke="#64748B" stroke-width="2"/>
  </g>
</svg>
