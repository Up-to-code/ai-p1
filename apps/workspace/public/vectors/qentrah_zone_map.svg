<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" id="qentrah_zone_map">
  <!-- Geographic Plot Logic -->
  <g id="plots" transform="translate(60, 60)">
    <rect x="0" y="0" width="80" height="120" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <rect x="100" y="0" width="180" height="80" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <rect x="0" y="140" width="140" height="140" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <!-- The Active Sector -->
    <rect x="160" y="100" width="120" height="180" fill="#2563EB" id="active_plot"/>
    <rect x="160" y="100" width="120" height="4" fill="#0F172A" id="active_pylon_cap"/>
  </g>
</svg>
